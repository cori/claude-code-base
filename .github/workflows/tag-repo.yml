name: Tag repo with rtappstore topic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  administration: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Add rtappstore topic
        run: gh repo edit "$GITHUB_REPOSITORY" --add-topic rtappstore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
